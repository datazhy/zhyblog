# Site settings
title: Zhy Blog
# brandName：文章页标题后缀，保持简短。首页/站点级标题用 SEOTitle。
brandName: 张航宇的博客
SEOTitle: 张航宇的博客｜美股投资、交易系统与 AI 自动化
authorName: 张航宇
authorAltName: Zhy
header-img: img/home-bg.jpg
email: mail@zhanghangyu.com
description: "张航宇的个人博客，记录美股投资研究、真实交易复盘、仓位与风险管理、交易系统迭代，以及 AI 自动化、Python、自托管和数据分析实践。"
keyword: "张航宇, Zhy张航宇, Zhy, datazhy, 张航宇的博客, Zhy Blog, 美股投资, 交易系统, 投资复盘, 仓位管理, 半导体, AI 自动化, Python, 数据分析"
url: "https://zhanghangyu.com" # your host, for absolute URL
baseurl: "" # for example, '/blog' if your blog hosted on 'host/blog'
lang: zh-CN # site language, used in <html lang="">, override per-page with `lang:` in front matter

# English translations are stored as a separate collection so the Chinese posts
# remain the canonical/default version at their existing URLs.
collections:
  en_posts:
    output: true

# Publish posts or collection documents with a future date.
future: true

# SNS settings
RSS: false
#zhihu_username: huxpro
#github_username: huxpro
#twitter_username: huxpro
#facebook_username:  huxpro
#linkedin_username:  firstname-lastname-idxxxx

# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
paginate: 10
exclude:
  [
    "less",
    "node_modules",
    "Gruntfile.js",
    "Gemfile",
    "Gemfile.lock",
    "Rakefile",
    "package.json",
    "package-lock.json",
    "README.md",
    "README.zh.md",
    "publishing-guide.md",
    "scripts",
  ]
anchorjs: true # if you want to customize anchor. check out line:181 of `post.html`
# All front matter dates are authored in China Standard Time.
timezone: Asia/Shanghai

# Gems
# from PR#40, to support local preview for Jekyll 3.0
# make sure you have this gem installed
# `$ gem install jekyll-paginate`
plugins: [jekyll-paginate, jekyll-sitemap]

# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
  input: GFM # use Github Flavored Markdown !important
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# 评论系统：Artalk（自托管，数据在自己服务器的 SQLite 里）
# 服务端部署在 /opt/artalk，经 nginx 反代；后台 https://comment.zhanghangyu.com
# 原先用的 Disqus 在中国大陆被墙，读者基本看不到，已弃用。
artalk_server: https://comment.zhanghangyu.com
artalk_site: Zhy Blog

# Analytics settings
# Baidu Analytics
# ba_track_id: [your track id]

# Google Analytics (GA4)
# 注意：GA4 的 gtag.js 已直接写在 _includes/head.html 中；
# 旧版 analytics.js 加载逻辑已移除（不兼容 G- 开头的 GA4 ID）。
# ga_track_id: "G-4EP3T98XND"
# ga_domain: zhy.win

# Sidebar settings
sidebar: true # whether or not using Sidebar.
sidebar-about-description: "永远年轻 永远热泪盈眶 <br> React Team @ Delloite"
sidebar-avatar: https://github.com/datazhy.png # use absolute URL, seeing it's used in both `/` and `/about/`

# Featured Tags
featured-tags: true # whether or not using Feature-Tags
featured-condition-size: 1 # 回退规则：标签文章数需大于此值才展示
# 策展顺序：按此顺序优先展示，且只渲染真实存在文章的标签（不制造空分类）。
# 留空则回退到上面的 featured-condition-size 阈值逻辑。
featured-tags-order:
  - 美股
  - 投资复盘
  - 交易系统
  - 半导体
  - AI
  - Python

# Progressive Web Apps
# 已停用：静态博客不需要离线缓存，且 SW 的 stale-while-revalidate 会让更新延迟一轮生效
chrome-tab-theme-color: "#000000"
service-worker: false

# MathJax rendering for layout:page (e.g. post preview)
page-mathjax: false

