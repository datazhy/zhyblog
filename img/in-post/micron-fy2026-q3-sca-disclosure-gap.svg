<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 940" role="img" aria-labelledby="sca-title sca-desc">
  <title id="sca-title">美光 FY2026 Q3 SCA 披露口径对比</title>
  <desc id="sca-desc">对比 2026 年 5 月 28 日 10-Q 期末口径与 2026 年 6 月 24 日财报电话会口径。10-Q 披露剩余履约义务约 50 亿美元、合同负债 4.22 亿美元；电话会披露 16 份协议，其中 14 份按最低数量和最低价格计算约 1,000 亿美元，财务承诺约 220 亿美元，其中现金押金约 180 亿美元。数字不可直接相减，因为统计时点、纳入规则和现金状态不同。</desc>
  <rect width="520" height="940" fill="#f8fafc"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
    <text x="260" y="46" font-size="28" fill="#172033" font-weight="700" text-anchor="middle">50 亿与 1,000 亿为什么不矛盾</text>
    <text x="260" y="76" font-size="16" fill="#64748b" text-anchor="middle">SCA 披露的统计时点、纳入规则与现金状态不同</text>

    <rect x="24" y="108" width="472" height="170" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M42 108 H478 A18 18 0 0 1 496 126 V158 H24 V126 A18 18 0 0 1 42 108Z" fill="#e8f0ff"/>
    <text x="48" y="142" font-size="18" fill="#1d4ed8" font-weight="700">2026-05-28 · 10-Q 期末口径</text>
    <line x1="260" y1="176" x2="260" y2="238" stroke="#e2e8f0" stroke-width="2"/>
    <text x="142" y="202" font-size="34" fill="#172033" font-weight="700" text-anchor="middle">约 50 亿</text>
    <text x="142" y="228" font-size="16" fill="#475569" text-anchor="middle">剩余履约义务（RPO）</text>
    <text x="378" y="202" font-size="34" fill="#172033" font-weight="700" text-anchor="middle">4.22 亿</text>
    <text x="378" y="228" font-size="16" fill="#475569" text-anchor="middle">已确认合同负债</text>
    <text x="260" y="262" font-size="15" fill="#64748b" text-anchor="middle">只反映期末已签、且符合 RPO 纳入条件的合同</text>

    <path d="M260 296 V328 M248 317 L260 329 L272 317" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="90" y="342" width="340" height="48" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="260" y="373" font-size="19" fill="#9a3412" font-weight="700" text-anchor="middle">不是同一时点，也不是同一口径</text>

    <rect x="24" y="416" width="472" height="310" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M42 416 H478 A18 18 0 0 1 496 434 V466 H24 V434 A18 18 0 0 1 42 416Z" fill="#eafbf3"/>
    <text x="48" y="450" font-size="18" fill="#047857" font-weight="700">2026-06-24 · 财报电话会口径</text>

    <text x="50" y="514" font-size="32" fill="#172033" font-weight="700">16 份</text>
    <text x="174" y="514" font-size="17" fill="#475569">已签 SCA，包含期末后新签协议</text>
    <line x1="48" y1="536" x2="472" y2="536" stroke="#e2e8f0"/>

    <text x="50" y="585" font-size="32" fill="#172033" font-weight="700">约 1,000 亿</text>
    <text x="50" y="612" font-size="17" fill="#475569">14 份协议的最低合同收入</text>
    <text x="314" y="612" font-size="15" fill="#64748b">最低数量 × 最低价格</text>
    <line x1="48" y1="634" x2="472" y2="634" stroke="#e2e8f0"/>

    <text x="50" y="683" font-size="32" fill="#172033" font-weight="700">约 220 亿</text>
    <text x="226" y="683" font-size="17" fill="#475569">财务承诺</text>
    <text x="50" y="710" font-size="16" fill="#64748b">包含未来到账项目，其中约 180 亿为现金押金</text>

    <g>
      <circle cx="48" cy="770" r="17" fill="#e8f0ff"/>
      <text x="48" y="776" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="middle">1</text>
      <text x="78" y="767" font-size="17" fill="#172033" font-weight="700">时点不同</text>
      <text x="173" y="767" font-size="16" fill="#64748b">期末数据 vs. 期后更新</text>

      <circle cx="48" cy="818" r="17" fill="#eafbf3"/>
      <text x="48" y="824" font-size="16" fill="#047857" font-weight="700" text-anchor="middle">2</text>
      <text x="78" y="815" font-size="17" fill="#172033" font-weight="700">纳入规则不同</text>
      <text x="198" y="815" font-size="16" fill="#64748b">无价格带协议不计入 RPO</text>

      <circle cx="48" cy="866" r="17" fill="#fff7ed"/>
      <text x="48" y="872" font-size="16" fill="#9a3412" font-weight="700" text-anchor="middle">3</text>
      <text x="78" y="863" font-size="17" fill="#172033" font-weight="700">现金状态不同</text>
      <text x="198" y="863" font-size="16" fill="#64748b">未来承诺不等于已确认负债</text>
    </g>

    <text x="24" y="910" font-size="13" fill="#94a3b8">来源：Micron FY2026 Q3 Prepared Remarks、Earnings Deck、</text>
    <text x="24" y="930" font-size="13" fill="#94a3b8">Form 10-Q；作者整理。</text>
  </g>
</svg>
