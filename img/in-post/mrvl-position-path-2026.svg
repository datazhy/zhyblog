    <g font-size="17" fill="#475569">
      <text x="110" y="605"><tspan font-weight="700" fill="#9a3412">①</tspan> 08/17 盘前卖出 80 股，仓位归零</text>
      <text x="462" y="605"><tspan font-weight="700" fill="#9a3412">②</tspan> 同日高价买回 100 股，数小时后再次归零</text>
      <text x="890" y="605"><tspan font-weight="700" fill="#9a3412">③</tspan> 08/19 卖出重建的 20 股</text>
    </g>

    <line x1="72" y1="634" x2="1128" y2="634" stroke="#e2e8f0"/>
    <text x="72" y="662" font-size="16" fill="#94a3b8">来源：IBKR 成交记录与 flex_nav_daily；%NAV 按当日账户净值回溯，日内仅作近似。</text>
