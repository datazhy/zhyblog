    <line x1="110" y1="520" x2="1140" y2="520" stroke="#94a3b8" stroke-width="1.5"/>

    <g font-size="17" fill="#64748b" text-anchor="middle">
      <text x="120" y="552">07/14</text>
      <text x="215" y="552">07/31</text>
      <text x="310" y="552">08/05</text>
      <text x="410" y="552">08/06</text>
      <text x="515" y="552">08/07</text>
